# Finalized acceptance criteria. Explicit defaults and user G1 override: tz_status.json.
- id: AC-S1
  type: functional
  requirement: 'S1: IT-доступы, режим it_support.'
  acceptance: «Как подключиться к VPN?» → клиент VPN и контакт IT; «Не приходит письмо на корпоративную почту» → квота/спам и контакт IT; «Как получить доступ к Git?»
    → заявка и согласование руководителя. Каждая пара проверяется integration-тестом по подстроке/regex ожидаемого факта из обезличенного утверждённого FAQ соответствующего
    режима; конкретные контакты, числа, ссылки и правила берутся из этого FAQ, поэтому его замена не требует изменения AC.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: mandatory
  test_hint: integration
- id: AC-S2
  type: functional
  requirement: 'S2: льготы, режим benefits.'
  acceptance: «Какие льготы по ДМС?» → полис и HR-контакт; «Сколько дней отпуска?» → число дней из faq.md; «Как оформить больничный?» → шаги и HR-контакт. Каждая
    пара проверяется integration-тестом по подстроке/regex ожидаемого факта из обезличенного утверждённого FAQ соответствующего режима; конкретные контакты, числа,
    ссылки и правила берутся из этого FAQ, поэтому его замена не требует изменения AC.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: mandatory
  test_hint: integration
- id: AC-S3
  type: functional
  requirement: 'S3: обучение, режим learning.'
  acceptance: «Какие курсы доступны?» → ссылка на каталог; «Как согласовать обучение?» → шаги согласования; «Есть ли бюджет на обучение?» → лимит/правило. Каждая
    пара проверяется integration-тестом по подстроке/regex ожидаемого факта из обезличенного утверждённого FAQ соответствующего режима; конкретные контакты, числа,
    ссылки и правила берутся из этого FAQ, поэтому его замена не требует изменения AC.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: mandatory
  test_hint: integration
- id: AC-S4
  type: functional
  requirement: 'S4: персональный план онбординга по роли/отделу, onboarding_plan.'
  acceptance: 'Роль/отдел вводятся через /start или при первом onboarding_plan и сохраняются session_manager с TTL 24 ч; приоритет plans/<role>__<department>.md →
    plans/<role>.md. Тестовые пары (developer,engineering) → developer__engineering.md при наличии обоих файлов, (developer,other) → developer.md без специального
    файла, (unknown,other) → сообщение «план не настроен», default.md при наличии и предложение эскалации (default), а без default.md → то же сообщение/эскалация
    без выдуманного чеклиста; оба отсутствующих персональных плана обязательно пишут analytics/unanswered.jsonl с reason="missing_plan". Default: предложение эскалации
    при missing_plan требует подтверждения пользователя; подтверждение запускает AC-S7 с reason=explicit, без третьего reason. Тестовые имена/планы — fixtures, не
    корпоративные факты; TTL отсчитывается от последнего явного ввода роли/отдела, а после истечения данные запрашиваются заново.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/utils/session_manager.py
  priority: mandatory
  test_hint: integration
- id: AC-S5
  type: functional
  requirement: 'S5: культура и политики, режим culture.'
  acceptance: «Какой график работы?» → гибкий график/часы; «Есть ли дресс-код?» → правило; «Как оформить командировку?» → шаги и HR-контакт. Каждая пара проверяется
    integration-тестом по подстроке/regex ожидаемого факта из обезличенного утверждённого FAQ соответствующего режима; конкретные контакты, числа, ссылки и правила
    берутся из этого FAQ, поэтому его замена не требует изменения AC.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: mandatory
  test_hint: integration
- id: AC-S6
  type: functional
  requirement: 'S6: вопрос вне базы вызывает fallback без выдумывания.'
  acceptance: 'Similarity нормализована в [0,1], выше означает релевантнее; при score < rag.score_threshold (default 0.65) бот сообщает об отсутствии подтверждённого
    ответа, не выдумывает HR-факты и предлагает эскалацию, при score >= порога допускается ответ по извлечённому контексту. Default: для FAISS L2 distance d>=0 адаптер
    вне защищённого RAG-ядра использует similarity=1/(1+d); интеграционная проверка включает score 0.649, 0.650, 0.651 и крайние значения 0/1, а ядро остаётся неизменным
    по AC-C03.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  priority: mandatory
  test_hint: integration
- id: AC-S7
  type: functional
  requirement: 'S7: явный запрос эскалации или два fallback подряд создают заявку.'
  acceptance: 'Явная эскалация создаёт заявку с reason=explicit; два последовательных RAG-fallback в сессии создают заявку с reason=fallback_x2 через webhook по AC-F05.
    Каждый RAG-fallback увеличивает счётчик; успешный RAG-ответ, успешное создание тикета или истечение TTL 24 ч сбрасывает его, LLM-provider fallback его не увеличивает;
    default: после неудачного создания счётчик сохраняется, последующий RAG-fallback при счётчике >=2 даёт одну новую попытку создания заявки по AC-F05 для этого
    запроса.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/utils/session_manager.py
  priority: mandatory
  test_hint: integration
- id: AC-S8
  type: functional
  requirement: 'S8: новый YAML-режим без изменения кода.'
  acceptance: После добавления корректной папки config/modes/<mode>/ с mode.yaml и указанными prompt/FAQ режим загружается и обрабатывает запрос; diff исходного кода
    пуст.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  priority: mandatory
  test_hint: integration
- id: AC-F01
  type: functional
  requirement: Чеклист онбординга.
  acceptance: 'Сотруднику выдаётся чеклист из выбранного в AC-S4 плана: специального, ролевого или default.md; пункты соответствуют этому плану. При отсутствии всех
    планов чеклист не выдумывается; хранение/изменение прогресса не требуется.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/utils/session_manager.py
  priority: mandatory
  test_hint: integration
- id: AC-F02
  type: functional
  requirement: Индексация FAISS из четырёх типов источников при старте или /reindex.
  acceptance: Тестовые config/modes/<mode>/faq.md, system_prompt.md, config/modes/onboarding_plan/plans/<role>.md и config/modes/culture/policies/*.md включаются
    в FAISS-индекс при старте или /reindex; контрольные фрагменты каждого типа извлекаются.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  - workspace/telegram-rag-bot/telegram_rag_bot/vectorstore/factory.py
  - workspace/telegram-rag-bot/orchestrator/retrieval/async_faiss.py
  priority: mandatory
  test_hint: integration
- id: AC-F03
  type: functional
  requirement: /reindex только для ADMIN_IDS.
  acceptance: Вызов /reindex пользователем из ADMIN_IDS переиндексирует источники; для пользователя вне whitelist индекс не изменяется.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: mandatory
  test_hint: integration
- id: AC-F04
  type: functional
  requirement: /status только для ADMIN_IDS.
  acceptance: 'Только ADMIN_IDS получает поля mode, version из METADATA, llm.gigachat/llm.yandexgpt=ok|fail по последнему health-check, faiss.documents, uptime_seconds
    и last_reindex=ISO8601 UTC|never; пользователь вне whitelist этих сведений не получает. Default: до первого health-check статус провайдера fail, до первого /reindex
    last_reindex=never; /status использует сохранённый результат проверки и не требует нового live-запроса.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  priority: mandatory
  test_hint: integration
- id: AC-N01
  type: nonfunctional
  requirement: p95 ответа <=3 сек.
  acceptance: 'p95 ответа <=3 сек от получения сообщения Telegram до завершения отправки ответа, включая внешние LLM и Telegram. Профиль: 10 RPS ровно 5 мин (3000
    запросов), база 1000 чанков, 1 pod 2 CPU/4 GB в тестовом K8s; 100 warmup-запросов отдельно и вне статистики. Default для согласования 1000 измерений с 10 RPS×5
    мин: 12 контрольных запросов AC-S1/S2/S3/S5 циклически чередуются; до запуска выбирается стратифицированная выборка 1000 из 3000 с fixed seed=0, по 83–84 наблюдения
    каждого сценария (84 у первых четырёх сценариев в порядке AC, 83 у остальных), список сохраняется до замеров; p95 — 950-е значение отсортированной выборки, ошибки/неотправленные
    ответы учитываются как +∞ без исключения неуспехов.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/main.py
  priority: mandatory
  test_hint: e2e
- id: AC-N02
  type: nonfunctional
  requirement: p95 RAG <=200 мс.
  acceptance: 'p95 RAG <=200 мс только retrieval+FAISS, без LLM/Telegram; профиль и заранее выбранная стратифицированная выборка 1000 из AC-N01 те же: 10 RPS×5 мин,
    1000 чанков, 1 pod 2 CPU/4 GB, 100 warmup отдельно, 83–84 наблюдения каждого из 12 сценариев, fixed seed=0. Default: измерение от входа в retrieval до результата
    FAISS, p95 — 950-е значение; только ошибка retrieval даёт +∞, при успешном retrieval ошибка LLM/Telegram не меняет RAG-измерение.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  - workspace/telegram-rag-bot/orchestrator/retrieval/async_faiss.py
  priority: mandatory
  test_hint: integration
- id: AC-N03
  type: nonfunctional
  requirement: LLM fallback GigaChat → YandexGPT.
  acceptance: При недоступности GigaChat запрос направляется в YandexGPT через существующее fallback-ядро; проверка с тестовыми провайдерами не меняет ядро.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/main.py
  - workspace/telegram-rag-bot/orchestrator/router.py
  priority: mandatory
  test_hint: integration
