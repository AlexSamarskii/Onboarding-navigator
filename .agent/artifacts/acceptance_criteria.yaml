  - workspace/telegram-rag-bot/telegram_rag_bot/main.py
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  priority: mandatory
  test_hint: manual
- id: AC-C06
  type: constraint
  requirement: Соблюсти out of scope и архитектурную готовность к мультиязычности.
  acceptance: В текущую поставку не входят голос, календарь, аналитический UI, авторизация в HR-системах, покупки, изменение HR-данных, произвольные действия и реализация
