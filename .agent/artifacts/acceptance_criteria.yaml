- id: AC-U01
  type: functional
  requirement: К ответу добавляются название разрешённого источника и дословная цитата из использованного RAG-контекста.
  acceptance: Для 12 контрольных пар AC-S1/AC-S2/AC-S3/AC-S5 положительные integration fixtures с достоверным provenance подтверждают название разрешённого источника
    и дословную цитату из использованного фрагмента, соответствующую ключевому факту пары, во всех 12/12 ответах; «основание недоступно» не засчитывается как положительный
    результат. Отдельные negative fixtures (источник недоступен / нет совпадения) возвращают RU «основание недоступно» без выдуманных ссылок и не заменяют 12 положительных
    проверок; при fallback по AC-S6 цитата не выдумывается. Сохраняются AC-F02/AC-C04 и запрет изменения ядра AC-C03; UI-строки по AC-C07.
