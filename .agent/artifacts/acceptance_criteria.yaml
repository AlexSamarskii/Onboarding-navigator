- id: AC-C01
  type: constraint
  requirement: Python >=3.11.
  acceptance: Декларация совместимости требует Python >=3.11; сборка и целевые тесты завершаются без ошибок на выбранном Python >=3.11 с фиксацией версии и пропусков.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/__main__.py
  - workspace/telegram-rag-bot/telegram_rag_bot/main.py
  priority: mandatory
  test_hint: integration
- id: AC-C02
  type: constraint
  requirement: Не менять ядро multi-LLM fallback.
  acceptance: Diff относительно baseline не содержит изменений orchestrator/router.py; существующее fallback-ядро не заменено.
  linked_modules:
  - workspace/telegram-rag-bot/orchestrator/router.py
  - workspace/telegram-rag-bot/telegram_rag_bot/main.py
  priority: mandatory
  test_hint: manual
- id: AC-C03
  type: constraint
  requirement: Не менять ядро RAG.
  acceptance: Diff относительно baseline не содержит изменений RAGChainFactory и retrieval-ядра перечисленных модулей; адаптация источников не подменяет ядро.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  - workspace/telegram-rag-bot/orchestrator/retrieval/async_faiss.py
  priority: mandatory
  test_hint: manual
- id: AC-C04
  type: constraint
  requirement: Сохранить YAML-режимы; конфигурировать через YAML.
  acceptance: it_support и контракт modes.directory совместимы с baseline; режимы, порог score, integrations.ticketing и остальные несекретные настройки задаются
    YAML без изменения кода при смене значений.
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  priority: mandatory
  test_hint: integration
- id: AC-C05
  type: constraint
  requirement: Секреты и токены только в .env; ADMIN_IDS whitelist.
  acceptance: Секреты/токены задаются только через .env и отсутствуют в коде, YAML и поставляемых артефактах; административные операции проверяют ADMIN_IDS. Логи,
