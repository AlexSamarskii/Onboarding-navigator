  - workspace/telegram-rag-bot/telegram_rag_bot/__main__.py
  priority: mandatory
  test_hint: e2e
- id: AC-N10
  type: nonfunctional
  requirement: Coverage >=78%.
  acceptance: 'Line coverage telegram_rag_bot/ >=78% по команде pytest --cov=telegram_rag_bot --cov-report=term с конфигурацией исключений: __main__.py, tests/, migrations/,
    автогенерируемые файлы и внешние адаптеры с живыми API; каждое исключение обосновано в отчёте. Default: исключается только код, действительно требующий живого
    API, а тестируемая с doubles бизнес-логика остаётся в знаменателе; line coverage, не branch coverage.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/main.py
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
