  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/config_loader.py
  - workspace/telegram-rag-bot/telegram_rag_bot/mode_loader.py
  priority: mandatory
  test_hint: manual
- id: AC-O01
  type: functional
  requirement: Top-3 ближайших вопроса при низком score.
  acceptance: 'При score < rag.score_threshold предлагаются top-3 ближайших вопроса в порядке убывания нормализованной similarity из AC-S6; default: при менее трёх
    уникальных вопросов показываются все имеющиеся без дублей, при равных score порядок стабилен по тексту вопроса.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: optional
  test_hint: integration
- id: AC-O02
  type: functional
  requirement: Неотвеченные вопросы в analytics/unanswered.jsonl.
  acceptance: 'Обычный неотвеченный HR-вопрос с RAG-fallback создаёт валидную JSON-строку в analytics/unanswered.jsonl, позволяющую определить вопрос; default: timestamp
    ISO8601 UTC, секреты и исходный Telegram ID в запись не попадают. Этот optional AC касается обычных неотвеченных вопросов; запись reason="missing_plan" обязательна
    отдельно по AC-S4.'
  linked_modules:
  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/telegram_rag_bot/langchain_adapter/rag_chains.py
  priority: optional
  test_hint: integration
- id: AC-F05
  type: functional
  requirement: HTTP webhook ticketing и уведомление HR.
  acceptance: 'POST JSON на integrations.ticketing.url содержит ticket_id UUID, user_id_hash SHA-256 Telegram ID, mode, query, timestamp ISO8601 UTC, reason explicit|fallback_x2
    и top_score; notify_chat_id берётся из integrations.ticketing.hr_chat_id в том же webhook, без настройки тикет создаётся без HR-уведомления. Default: успех —
    HTTP 2xx как подтверждение приёма всего payload; ровно 3 попытки, перед попытками 1/2/3 паузы 1/2/4 сек соответственно, timeout каждого запроса 5 сек, ticket_id
    одинаков при повторах; после трёх неудач пользователю сообщается ошибка, пишется ERROR без секретов/исходного ID и увеличивается tickets_failed_total; query перед
    отправкой очищается от секретов/исходного ID, неизвестный top_score=null.'
  linked_modules:
