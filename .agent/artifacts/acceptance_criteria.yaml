  - workspace/telegram-rag-bot/telegram_rag_bot/handlers.py
  - workspace/telegram-rag-bot/orchestrator/router.py
  priority: mandatory
  test_hint: integration
- id: AC-N07
  type: nonfunctional
  requirement: Метрика tickets_created_total.
  acceptance: 'Экспорт метрик содержит tickets_created_total; успешно созданная тестовая заявка увеличивает счётчик. Default: на один подтверждённый ticket_id приходится
