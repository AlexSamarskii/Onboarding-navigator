  - workspace/telegram-rag-bot/orchestrator/router.py
  priority: mandatory
  test_hint: integration
- id: AC-N05
  type: nonfunctional
  requirement: Метрика rag_score_bucket.
  acceptance: Экспорт метрик содержит rag_score_bucket; тестовый полученный RAG-score отражается в buckets.
  linked_modules:
