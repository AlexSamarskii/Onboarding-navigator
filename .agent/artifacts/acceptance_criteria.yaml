  priority: mandatory
  test_hint: integration
- id: AC-N06
  type: nonfunctional
  requirement: Метрика fallback_total.
  acceptance: Экспорт содержит fallback_total{type="rag"}, увеличиваемый при similarity ниже порога, и fallback_total{type="llm"}, увеличиваемый при переключении
    GigaChat → YandexGPT; проверки событий подтверждают независимые приращения нужных серий.
  linked_modules:
