# Reuse/Adapter Agent — G1b draft; implementation not started.
# 8/8 adapt entries plus five unchanged reuse boundaries; AC remain unchanged.
- path: workspace/telegram-rag-bot-src/telegram_rag_bot/main.py
  reuse_type: adapter
  adapter_notes: >-
    Adapt main(), create_router(), build_providers_list() and existing reload wiring.
    Before first create_chain bind the proposed hr_adapter LocalFAISSProvider subclass
    to rag_factory.vectorstore_provider; initialize multi-source coordinator,
    citations/diagnostics/i18n, ticketing and analytics. Register proposed /reindex
    and /status alongside existing handlers; preserve /reload_faq compatibility.
    Wrap providers on initial construction and reload, delegating async
    generate(prompt, params=None)->str and health_check()->bool with unchanged
    config/name and exceptions. Store health results with timeouts. Reuse existing
    health_handler, metrics_handler and Prometheus HTTP endpoint.
  risks:
    - Config reload rebuilds providers and clears chains; an undecorated reload would lose instrumentation.
    - Router first-available may skip unhealthy GigaChat during health_check; request-local observation must count this switch, not just failed generate calls. Direct YandexGPT calls are not switches.
    - LCEL sync invocation runs in a worker thread; observation state must remain request-local across threads/async calls, not global.
    - Root integrations/analytics packages require explicit product import path in local execution and Docker; wheel alone is insufficient.
    - Real Telegram/LLM latency requires the approved external environment and tests/load/run_baseline.py; rate limits and correlation of replies can invalidate measurements.
  linked_ac: [AC-F02, AC-F03, AC-F04, AC-N03, AC-N08, AC-N09, AC-C02, AC-C03, AC-U01, AC-U02]

- path: workspace/telegram-rag-bot-src/telegram_rag_bot/handlers.py
  reuse_type: adapter
  adapter_notes: >-
    Extend TelegramHandlers.__init__, cmd_start, cmd_set_mode, cmd_reload_faq,
    handle_message, cmd_help and handle_callback_query; retain _is_admin,
    _get_mode_display and safe output escaping. In handle_message preserve
    response.context from the exact chain invocation before extracting answer;
    pass it to proposed citations.py for allowlisted source title and verbatim
    quote validation. No second retrieval and no invented chunk_id. Catch the
    adapter's low-score typed exception before the generic error handler and
    enter AC-S6; only RAG result events change fallback streak. Route diagnostics
    outside RAG, retain escalation on every step, resolve profiles/plans with TTL,
    and call the planned ticketing/JSONL adapters. Move UI to RU catalog through
    proposed i18n.py; add admin-only command methods for /reindex and /status.
  risks:
    - Effort L: 47 logical Cyrillic literal expressions including one docstring; UI, regex and logs must be distinguished.
    - Existing input/context/full-answer and raw-user-ID logs must be removed or redacted; escaping output alone does not protect logs.
    - Truncation and Markdown fallback can remove/mangle citations; all 12 positive fixtures must preserve both fact and source/quote.
    - Current invoke timeout cancels awaiting but may leave worker work running; late completion must not double-create tickets or alter an expired session.
    - Proposed citations/diagnostics helpers are new modules, not existing baseline APIs.
  linked_ac: [AC-S1, AC-S2, AC-S3, AC-S4, AC-S5, AC-S6, AC-S7, AC-S8, AC-F01, AC-F03, AC-F04, AC-C05, AC-C06, AC-C07, AC-U01, AC-U02, AC-O01]

