- path: workspace/telegram-rag-bot-src/telegram_rag_bot/utils/session_manager.py
  reuse_type: adapter
  adapter_notes: >-
    Extend SessionManager._default_session/get_session/set_session, preserving
    their async public signatures and existing mode/history consumers. Add
    profile expiry anchored to last explicit role/department input, diagnostics
    state, RAG streak and active ticket UUID/deduplication state. Expiry after
    24h resets profile/streak; success and ticket creation follow AC-S7, while
    diagnostic questions leave streak unchanged. Keep Redis production backend.
  risks:
    - Redis setex refreshes storage TTL on every write, while memory uses created_at; explicit profile expiry must dominate either sliding behavior.
    - Redis client is synchronous inside async methods; latency/blocking must be accounted for without pretending it is async I/O.
    - Redis errors fall back to local memory and can split state; do not claim shared persistence or cross-pod deduplication from this fallback.
    - Read-modify-write races can duplicate tickets; serialize same-session updates and preserve UUID across webhook retries.
    - Existing naive timestamps and raw-ID expiry logs need UTC/redaction adaptation within this file.
  linked_ac: [AC-S4, AC-S7, AC-F01, AC-U02, AC-C05]

