- path: workspace/telegram-rag-bot-src/telegram_rag_bot/vectorstore/local_faiss.py
  reuse_type: as_is
  adapter_notes: >-
    KEEP LocalFAISSProvider unchanged. Proposed hr_adapter subclass delegates
    load_index/save_index/delete_index; facade forwards native FAISS interface
    and supplies as_retriever(search_kwargs) returning BaseRetriever. One native
    similarity_search_with_score obtains exact Documents; copied metadata retains
    source with score, low-score typed exception gates LLM before generation.
    Coordinator uses existing embeddings/chunk settings and save_index. Preserve
    load_index.cache_clear interface on override; invalidate inherited cached
    LocalFAISSProvider.load_index, facade cache and rag_factory.chains after
    save/delete. Acceptance integration must prove fresh retrieval after reindex.
  risks:
    - Base save_index/delete_index call self.load_index.cache_clear; an uncached override breaks them, facade-only clearing leaves the base stale.
    - similarity=1/(1+d) is valid only for the approved nonnegative L2 distance; invalid metric/NaN/empty context fail closed.
    - Facade must forward index/docstore/save behavior; never mutate shared FAISS document metadata or perform second search for quotes.
    - Existing embedding bridge must be retained; async embeddings cannot simply be passed where native FAISS expects a synchronous callable.
  linked_ac: [AC-C03, AC-F02, AC-F03, AC-S6, AC-U01, AC-N02, AC-O01]

